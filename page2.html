<html>
  <head>
    <title>
      menghitung bangub datar persegi
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>
    <div class="container mt-5">
    <div class="row g-3"">
        <div class="col-6">
            <div class="card">
      <div class="card-body">
  <h5 class="card-header text-center">luas persegi</h5>
    <h5 class="card-title text-center">rumus luas persegi</h5>
    <p class="sisi text-center">(sisi x sisi)</p>
    <div class="text-center">
    <input type="number" placeholder="masukan nilai disini" id="nilailuas"><br>
    <button class="btn btn-primary my-3" onclick="hitungLuas()">hitung</button>
    <div id="hasilLuas" class="hasil"> 
    </div>
    </div>
  </div>
</div>
        </div>
      <div class="col-6">
            <div class="card">
      <div class="card-body">
  <h5 class="card-header text-center">keliling persegi</h5>
    <h5 class="card-title text-center">rumus keliling persegi</h5>
    <p class="sisi text-center">(4 x sisi)</p>
    <div class="text-center">
    <input type="number" placeholder="masukan nilai disini" id="nilaikeliling"><br>
    <button class="btn btn-primary my-3" onclick="hitungkeliling()">hitung</button>
    <div id="hasilkeliling" class="hasil"> 
    </div>
    </div>
  </div>
</div>
      </div>


</div>
    </div>
  
  <script src="script.js"></script>
  </body>
  </html>
