<html>

<head>
  <title>
    menghitung bangub datar persegi
  </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <div class="container mt-5">
    <div class="row g-3"">
        <div class=" col-6">
      <div class="card">
        <div class="card-body">
          <h5 class="card-header text-center">luas persegi panjang</h5>
          <h5 class="card-title text-center">rumus luas persegi panjang</h5>
            <p class="sisi text-center">(panjang x lebar)</p>
            <div class="text-center">
              <input type="number" placeholder="alas" id="alas"><br>
              <input type="number" placeholder="tinggi" id="tinggi" class="mt-3"><br>
              <button class="btn btn-primary my-3" onclick="hitungluas()">hitung</button>
              <div id="hasilluas" class="hasil">
              </div>
            </div>
        </div>
      </div>
    </div>
    <div class="col-6">
      <div class="card">
        <div class="card-body">
          <h5 class="card-header text-center">keliling persegi panjang</h5>
          <h5 class="card-title text-center">rumus keliling persegi panjang</h5>
          <p class="sisi text-center">(4 x sisi)</p>
          <div class="text-center">
            <input type="number" placeholder="masukan nilai disini" id="s1"><br>
               <input type="number" placeholder="masukan nilai disini" id="s2" class="mt-3"><br>
               <input type="number" placeholder="masukan nilai disini" id="s3" class="mt-3"><br>
            <button class="btn btn-primary my-3" onclick="hitungkeliling()">hitung</button>
            <div id="hasilkeliling" class="hasil">
            </div>
          </div>
        </div>
      </div>
    </div>


  </div>
  </div>
  <script>
    function hitungluas() {
      let alas = parseFloat(document.getElementById("alas").value);
      let tinggi =parseFloat(document.getElementById("tinggi").value);
      if (isNaN(alas) || isNaN(tinggi || alas <=0 || tinggi <=0)) {
        alert("masukan nilai  yang valid");
        return;
      }
      let hasilluas = 0.5 * (alas * tinggi);
      document.getElementById("hasilluas").innerHTML = `rumus:0,5 x ${alas} x ${tinggi}<br> hasil:
      ${hasilluas}`;
    }


       function hitungkeliling() {
      let s1 = document.getElementById("sisi1").value;
      let s2 = document.getElementById("sisi2").value;
      let s3 = document.getElementById("sisi3").value;
     
         if (s1 <=0|| s2 <= 0 || s3 <=0) {
        alert("masukan nilai lebar yang valid");
        return;
      }
      let hasilkeliling = parseFloat(s1) = parseFloat(s2) + parseFloat(s3);
      document.getElementById("hasilkeliling").innerHTML = `rumus:${s1} + ${s2} + ${s3})<br> hasil:
      ${hasilkeliling}`;
    }
    </script>

</body> src=

</html>
